<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="heart-title heart-desc">
  <title id="heart-title">Heart Circulation and Blood Pressure Diagram</title>
  <desc id="heart-desc">Educational diagram showing the heart pumping blood outward through arteries and returning through veins, illustrating systolic and diastolic blood pressure.</desc>
  <rect width="640" height="440" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />

  <text x="24" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
    Heart Circulation &amp; Blood Pressure
  </text>
  <text x="24" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">
    Understanding how your heart pumps blood and what top/bottom BP numbers mean
  </text>

  <!-- Artery Loop (Top - Outgoing Blood) -->
  <path d="M300 164 C300 108 160 108 160 198 C160 278 214 316 286 316" fill="none" stroke="#0284C7" stroke-width="14" stroke-linecap="round" />
  <polygon points="186,126 202,118 200,134" fill="#0F172A" />

  <!-- Vein Loop (Bottom/Right - Returning Blood) -->
  <path d="M342 316 C426 316 480 278 480 198 C480 112 340 112 340 164" fill="none" stroke="#0F766E" stroke-width="14" stroke-linecap="round" />
  <polygon points="454,274 438,282 440,266" fill="#0F172A" />

  <!-- Central Stylized Heart Pump -->
  <path d="M320 264 C284 240 262 212 262 184 C262 162 280 148 300 148 C312 148 318 154 320 162 C322 154 328 148 340 148 C360 148 378 162 378 184 C378 212 356 240 320 264 Z" fill="#CCFBF1" stroke="#0F766E" stroke-width="3.5" />
  <text x="320" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">
    Heart
  </text>
  <text x="320" y="219" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0F766E">
    Steady Pump
  </text>

  <!-- Artery & Vein Labels -->
  <rect x="34" y="148" width="166" height="58" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="44" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Arteries (Outgoing)</text>
  <text x="44" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Carry blood from heart;</text>
  <text x="44" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">BP cuff measures pressure here</text>

  <rect x="440" y="148" width="176" height="58" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" />
  <text x="450" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Veins (Returning)</text>
  <text x="450" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Return blood smoothly back</text>
  <text x="450" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">to the heart</text>

  <!-- Blood Pressure Reading Key -->
  <rect x="76" y="340" width="488" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  <text x="96" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
    Blood Pressure Numbers (e.g., Systolic / Diastolic mmHg):
  </text>
  <text x="96" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">
    • Top number (Systolic): pressure when heart pumps   • Bottom number (Diastolic): pressure when heart rests
  </text>

  <text x="24" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">
    Educational illustration only — ask your doctor for your personal target blood pressure range.
  </text>
</svg>
