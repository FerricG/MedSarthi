<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="dig-title dig-desc">
  <title id="dig-title">Oral Medicine Digestive Pathway Diagram</title>
  <desc id="dig-desc">Educational diagram showing how a swallowed medicine travels down the food pipe to the stomach, into the small intestine, and into the bloodstream.</desc>
  <rect width="640" height="440" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />

  <text x="24" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
    How Oral Medicines Travel Through the Body
  </text>
  <text x="24" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">
    Explains why water, meal timing, and not crushing special tablets matter
  </text>

  <!-- Step 1: Mouth / Tablet Intake -->
  <rect x="260" y="76" width="120" height="40" rx="12" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" />
  <text x="320" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
    1. Swallow Tablet
  </text>

  <!-- Food Pipe (Esophagus) -->
  <rect x="306" y="116" width="28" height="68" rx="6" fill="#E0F2FE" stroke="#0369A1" stroke-width="2.5" />
  <line x1="320" y1="124" x2="320" y2="174" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="4 3" />
  <polygon points="320,180 315,170 325,170" fill="#0F766E" />

  <!-- Stomach -->
  <path d="M306 184 C272 192 252 222 262 252 C272 280 316 292 356 278 C390 266 404 234 388 210 C376 192 346 188 334 184 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="3" />
  <ellipse cx="326" cy="236" rx="12" ry="7" fill="#0F766E" />
  <text x="326" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400E">
    Stomach
  </text>

  <!-- Connecting tube to Small Intestine -->
  <path d="M356 278 C372 290 372 304 352 310" fill="none" stroke="#0284C7" stroke-width="10" stroke-linecap="round" />

  <!-- Small Intestine Folded Coil -->
  <rect x="242" y="308" width="164" height="74" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="3" />
  <path d="M262 328 H382 C390 328 390 342 382 342 H262 C254 342 254 356 262 356 H382 C390 356 390 370 382 370 H262" fill="none" stroke="#0369A1" stroke-width="4" stroke-linecap="round" />

  <!-- Absorption Arrow into Bloodstream -->
  <path d="M408 345 H468" stroke="#0F766E" stroke-width="3" />
  <polygon points="476,345 464,339 464,351" fill="#0F766E" />

  <!-- Bloodstream Card -->
  <rect x="478" y="312" width="138" height="66" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2" />
  <text x="547" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#14532D">
    4. Bloodstream
  </text>
  <text x="547" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">
    Delivers medicine
  </text>
  <text x="547" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">
    through the body
  </text>

  <!-- Callout Cards -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#0F172A">
    <!-- Food Pipe -->
    <line x1="306" y1="148" x2="210" y2="148" stroke="#0369A1" stroke-width="2" />
    <circle cx="306" cy="148" r="4" fill="#0369A1" />
    <rect x="24" y="126" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#0369A1" stroke-width="1.5" />
    <text x="34" y="145">2. Food Pipe (Esophagus)</text>
    <text x="34" y="161" font-size="11" font-weight="400" fill="#475569">Swallow whole with water</text>

    <!-- Stomach -->
    <line x1="392" y1="230" x2="450" y2="230" stroke="#D97706" stroke-width="2" />
    <circle cx="392" cy="230" r="4" fill="#D97706" />
    <rect x="450" y="204" width="166" height="52" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
    <text x="460" y="224">Before vs After Food</text>
    <text x="460" y="240" font-size="11" font-weight="400" fill="#475569">Protects stomach &amp; timing</text>

    <!-- Small Intestine -->
    <line x1="242" y1="345" x2="200" y2="345" stroke="#0284C7" stroke-width="2" />
    <circle cx="242" cy="345" r="4" fill="#0284C7" />
    <rect x="24" y="320" width="176" height="50" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <text x="34" y="340">3. Small Intestine</text>
    <text x="34" y="357" font-size="11" font-weight="400" fill="#475569">Main site of absorption</text>
  </g>

  <text x="24" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">
    Educational illustration only — always follow your doctor's exact timing instructions.
  </text>
</svg>
